<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <p class="date" id="date"></p>

    <div class="card">
      <div class="photo-frame">
        <img id="daily-photo" src="" alt="Our photo">
      </div>
      <p class="greeting" id="greeting"></p>
      <p class="compliment" id="compliment"></p>
    </div>

    <div class="coupon-section" id="coupon-section">
      <div class="coupon">
        <div class="coupon-header">Today's Coupon</div>
        <p class="coupon-text" id="coupon-text"></p>
        <div class="coupon-footer">No expiration - redeem anytime!</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
